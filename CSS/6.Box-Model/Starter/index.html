<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Model Demonstration</title>
    <style>
      .box {
        background-color: yellow;
        width: 300px;
        height: 300px;
        /* border: 5px solid red;*/
        border-top: 20px solid red;
        border-bottom: 20px solid green;
        border-right: 20px solid black;
        border-left: 20px solid purple;
        padding-top: 20px;
        padding-bottom: 20px;
        padding-right: 20px;
        padding-left: 20px;
        margin: 50px;
      }
      h1 {
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Masyntech</h1>
    </div>
    <div class="box">
      <div class="content">
        This is the content area. The box around it demonstrates the CSS box
        model.
      </div>
    </div>
  </body>
</html>
