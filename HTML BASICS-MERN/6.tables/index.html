<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tables</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead {
        background-color: rgb(153, 221, 193);
      }
      tbody {
        background-color: rgb(228, 245, 231);
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h1>Student Grade Table</h1>
    <hr />
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Subject</th>
          <th>GRADE</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>monica</td>
          <td>maths</td>
          <td>A++</td>
        </tr>
        <tr>
          <td>monica</td>
          <td>maths</td>
          <td>A++</td>
        </tr>
        <tr>
          <td>monica</td>
          <td>maths</td>
          <td>A++</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
